# =============================================================================
# NostalgiaBox configuration
# =============================================================================
# The installer copies this file to config.yaml the first time it runs.
# Check it any time, from any folder, with:
#
#     nostalgiabox --check
#
# You do not need to edit this file for a normal setup. Every folder inside
# the media folder becomes a channel. The folder name is the channel name:
#
#   /media/nostalgiabox/
#     ├── Arthur/                -> channel 2 "Arthur"
#     ├── Dragon Tales/          -> channel 3 "Dragon Tales"
#     └── Winnie the Pooh/       -> channel 4 "Winnie the Pooh"
#
# Numbers follow alphabetical order, starting at first_channel_number.
#
# A USB drive is used instead when it is plugged in AND it contains show
# folders with videos. The installer mounts that drive at the usb path below.

media_root: /media/nostalgiabox
usb_media_root: /media/nostalgiabox-usb
prefer_usb: true
first_channel_number: 2      # number of the first discovered channel

# -----------------------------------------------------------------------------
# Optional: list channels yourself (numbers, names, skipping seasons).
# -----------------------------------------------------------------------------
# If you uncomment `channels:`, that list REPLACES folder discovery. Delete
# the list to go back to "one folder = one channel". Paths must be the real
# folder names, spaces included. There is no automatic renaming.
#
# channels:
#   - number: 2
#     name: "Dragon Tales"
#     path: "/media/nostalgiabox/Dragon Tales"
#   - number: 3
#     name: "Arthur"
#     path: /media/nostalgiabox/Arthur
#     # order: in_order          # this channel only; or put a .inorder file in the folder
#     # Leave out episodes you don't want on this channel:
#     exclude_seasons: ["6-25"]    # drop seasons 6 through 25 (S06E01, "Season 6")
#     exclude: ["*special*"]       # drop any file whose path matches

# -----------------------------------------------------------------------------
# How a channel behaves when you tune into it.
#   random    - start a fresh random episode (the classic "flip and a show
#               starts"); episodes keep rolling on shuffle after that.  [default]
#   resume    - pick up where you left off on that channel last time.
#   broadcast - the channel runs like a real always-on station: it advances in
#               real time even while you're watching something else, so you tune
#               in partway through whatever "would" be airing. (Needs ffprobe.)
# -----------------------------------------------------------------------------
tune_in: random

# How the episodes on a channel are chosen.
#   shuffle   - every episode once, then a new shuffle. This is the default.
#               Built for kids: variety, so the same episode is unlikely to
#               come back for a while, and flipping away returns to something
#               new. Like real TV.
#   in_order  - filename order, then loop back to the first. The place is
#               remembered across channel changes and reboots.
# shuffle: false is the same as order: in_order. If both are set, order wins.
# One show only, no channel list: an empty file named .inorder in that folder.
#   touch "/media/nostalgiabox/Dragon Tales/.inorder"
# Name files 101, 102, 103 or S01E01 or 1x02. Ep 2 sorts before Ep 10.
# Season 1/ comes before Season 2/.
# With in_order, tune_in random and resume both continue the saved place, and
# broadcast is that series as a real-time schedule. start_offset applies to
# shuffle only.
order: shuffle

# What happens at power-on.
#   shuffle_all - random episodes from every show, back to back.  [default]
#   channel     - tune to start_channel, like a TV.
start_mode: shuffle_all
start_channel: 2          # the channel used by start_mode: channel

# --- The show menu -----------------------------------------------------------
# Back (or OK, or Menu) on the remote opens a list of shows, A to Z. Pick a show
# to play it from the start, shuffle it, or choose a series and an episode.
# The menu closes by itself after this many seconds without a press (0 = never).
menu_timeout: 60

# --- Play/pause, fast-forward and rewind --------------------------------------
# Play/pause freezes the picture and shows the show, series, episode and the
# episode's name. Fast-forward and rewind jump by these many seconds.
seek_forward_seconds: 30
seek_back_seconds: 10

# --- Shuffle button -------------------------------------------------------------
# The remote button that means "a random episode of a random show". Press the
# button, then find its name with:
#   journalctl -u nostalgiabox -n 20 --no-pager | grep "does nothing"
# shuffle_button: KEY_F12

# --- Sound sync ----------------------------------------------------------------
# If voices are out of step with mouths, move the sound in milliseconds:
# positive plays it later, negative earlier (-2000 to 2000). Easier: Menu ->
# Sound sync, then left/right while watching. The value saved there (in
# settings.json beside the state file) wins over this one.
audio_delay_ms: 0

# --- The "feel" of the TV ----------------------------------------------------
# Every show keeps its own shape: 4:3 shows get black bars at the sides, 16:9
# shows fill the screen.

# Start each episode a random number of seconds in, between these two values, so
# channel switches land at varied points in the show (skips the black leader/
# intro too). Use a single number for a fixed offset, e.g. `start_offset: 5`.
start_offset: [6, 10]

# Channel-change effect: "none" (default), "glitch" (brief digital corruption),
# or "static" (analog snow).
transition: none
transition_duration: 0.4  # how long the effect shows (if not "none")

# With transition "none", keep the current show playing this many seconds while
# the next channel loads in the background, then cut over - so the picture never
# freezes on a channel change. 0 = switch immediately.
bridge_seconds: 0.8
channel_bug_seconds: 4    # how long the channel banner lingers
osd_duration: 2           # how long the volume bar / messages linger

# --- On-screen display look (the green digital readouts) ---------------------
# The defaults are built for young children: a big rounded font, and yellow and
# white on deep blue for strong contrast. For the old green terminal look, use
# font: "VT323", color: "#4DFF5A", glow: true.
ui:
  font: "Fredoka SemiBold"     # bundled rounded font (installed by install.sh)
  color: "#FFD23F"             # CH banner, volume bar, messages
  dim_color: "#123B18"         # (reserved) colour for unlit elements
  glow: false                  # false = thick dark outline (easier to read)
  menu_accent: "#FFD23F"       # the highlighted menu tile
  menu_background: "#16205A"   # the menu board, and text outlines
  menu_tile: "#2B3A8C"         # the other menu tiles

# --- Video decoding ----------------------------------------------------------
# auto-safe lets mpv pick hardware decoding. On a Raspberry Pi 3 (including the
# 3 A+), if H.264 video stutters, try v4l2m2m-copy. "no" decodes on the CPU.
hwdec: auto-safe

# --- Audio -------------------------------------------------------------------
# 100 leaves the Pi at full output so the TV's volume buttons (or the TV's own
# remote) are the real knob. Drop this only if you want the Pi to attenuate.
initial_volume: 100       # 0-100
volume_step: 5            # Pi mode: how much each volume press changes it
# Who the Flirc volume keys control.
#   auto  - the TV over HDMI-CEC when cec-client finds a television. If there
#           is no CEC TV, the Pi volume is used and nothing is shown on screen.
#   tv    - ask for the TV; fall back to the Pi when no television answers
#   pi    - the on-screen bar and mpv. The TV's volume stays where you set it.
# Flirc has no CEC mode of its own. Program it as in the README (Right = volume
# up, Left = volume down, m = mute). The TV must have CEC turned on (Anynet+,
# SimpLink, BRAVIA Sync, or the set's "HDMI control" name).
volume_control: auto
# Where the sound goes. Left out (or "auto"), it follows the TV: the box finds
# the HDMI port with a TV on it and uses that port for picture, sound and the
# TV remote, so either micro-HDMI port on a Pi 4 works. A vc4hdmi setting is
# treated as "auto". Set it only for something else, like a USB sound card;
# `nostalgiabox --list-audio` lists the names.
# audio_device: auto

# Pi mode only: pressing volume-down once more when already at 0 cleanly powers
# off the Pi so it's safe to unplug (needs the sudo rule from
# scripts/install-service.sh). In tv/auto mode the volume keys never move the
# Pi level, so they cannot shut the box down — use standby, or `sudo poweroff`.
power_off_on_min_volume: true
# power_off_command: ["sudo", "poweroff"]   # override the shutdown command

# --- Playback ----------------------------------------------------------------
scan_recursive: true      # also look inside season sub-folders for episodes
# video_extensions: [".mp4", ".mkv", ".avi", ".m4v"]   # override if needed
# shuffle_seed: 1234       # set for a repeatable shuffle order (mostly for tests)

# If a picture freezes (no movement, no sound), log the episode and recover.
# The first time, playback jumps ahead. If it is still stuck, the next episode
# starts. A file that freezes again is skipped the next time it comes up.
# Find the files in ~/.local/state/nostalgiabox/problem-files.log
# (the same lines are in: journalctl -u nostalgiabox | grep "problem file").
# stall_watch: true
# stall_timeout: 20        # seconds with no progress before it counts
# stall_grace: 8           # ignore this long after a file starts or a seek
# stall_seek: 10           # seconds to jump ahead on the first freeze
# stall_flag_after: 2      # freezes before the file is skipped on sight

# --- Remote control input ----------------------------------------------------
# All backends are auto-detected; anything unavailable is skipped, so these are
# only needed to turn things off or fine-tune device selection.
input:
  keyboard: true          # USB/IR remotes & keyboards (via Linux evdev)
  cec: true               # the TV's own remote over HDMI-CEC (needs cec-utils)
  stdin: false            # developer keyboard over the terminal
  # keyboard_name_filter: "remote"   # only listen to devices whose name matches
  # keyboard_devices: ["/dev/input/event0"]  # or pin exact devices
  # keyboard_grab: false             # true = stop keystrokes leaking to console

  # Map specific keys to actions (handy for odd remotes). Find a button's key
  # name with `sudo evtest`. Actions: channel_up, channel_down, volume_up,
  # volume_down, mute, enter, back, menu, play_pause, fast_forward, rewind,
  # shuffle (a random episode of a random show; asks first while one is on),
  # info, last_channel, power, quit,
  # digit_0..digit_9, or none (to unbind). In the show menu, channel up/down
  # move the highlight, enter chooses, and back goes up a level. Escape is
  # back, not quit. Example for a Logitech R400 presenter:
  # key_overrides:
  #   KEY_PAGEUP: channel_down    # left  (<) arrow
  #   KEY_PAGEDOWN: channel_up    # right (>) arrow
  #   KEY_ESC: volume_down        # play-screen button (sends Esc)
  #   KEY_F5: volume_down         #   ...and sometimes F5 - map both
  #   KEY_DOT: volume_up          # blank-screen button
  #   KEY_B: volume_up            #   ...blank button alt code - map both
